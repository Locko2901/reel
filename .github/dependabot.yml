version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /ci/docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
