name: OBS bump

# Opens a pull request bumping desktop/obs/pinned.json, and the version THIRD_PARTY.md names,
# when OBS's latest release is newer. Opened by the repository's bot (CONTRIBUTING.md), its
# checks start by themselves; opened with GITHUB_TOKEN, they start once it is closed and reopened.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: OBS · bump the pin
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: The repository's bot, when it has one
        id: bot
        if: ${{ vars.REEL_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # GitHub takes an app's ID where its client ID is asked for
          client-id: ${{ vars.REEL_BOT_APP_ID }}
          private-key: ${{ secrets.REEL_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOT: ${{ steps.bot.outputs.token != '' }}
        with:
          github-token: ${{ steps.bot.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const path = 'desktop/obs/pinned.json';
            const base = (await github.rest.repos.get({ owner, repo })).data.default_branch;
            const file = (await github.rest.repos.getContent({ owner, repo, path, ref: base })).data;
            const text = Buffer.from(file.content, 'base64').toString('utf8');
            const pin = JSON.parse(text);
            const latest = (await github.rest.repos.getLatestRelease({ owner: 'obsproject', repo: 'obs-studio' })).data;
            const version = latest.tag_name.replace(/^v/, '');
            const newer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
            if (!/^\d+\.\d+\.\d+$/.test(version) || !newer(version, pin.version)) { core.info(`OBS ${version} is not newer than the pin, ${pin.version}`); return; }
            const asset = (name) => {
              const a = latest.assets.find((x) => x.name === name);
              if (!a || !/^sha256:[0-9a-f]{64}$/.test(a.digest || '')) throw new Error(`OBS ${version} has no ${name} with a published SHA-256`);
              return { url: a.browser_download_url, sha256: a.digest.slice(7), size: a.size };
            };
            const win = asset(`OBS-Studio-${version}-Windows-x64.zip`);
            const src = asset(`OBS-Studio-${version}-Sources.tar.gz`);
            // OBS builds its Linux package for its newest Ubuntu alone: the newest Ubuntu among
            // the assets is taken, and the image with the real OBS moves to it.
            const debs = latest.assets
              .map((x) => [x.name.match(/^OBS-Studio-(.+)-Ubuntu-(\d+)\.(\d+)-x86_64\.deb$/), x.name])
              .filter(([m]) => m && m[1] === version)
              .sort(([a], [b]) => (b[2] - a[2]) || (b[3] - a[3]));
            if (!debs.length) throw new Error(`OBS ${version} has no Ubuntu package (OBS-Studio-${version}-Ubuntu-<YY.MM>-x86_64.deb) among its assets: ${latest.assets.map((x) => x.name).join(', ')}`);
            const ubuntu = `${debs[0][0][2]}.${debs[0][0][3]}`;
            const deb = asset(debs[0][1]);
            let next = text.split(pin.version).join(version);
            const notice = 'THIRD_PARTY.md';
            const credits = (await github.rest.repos.getContent({ owner, repo, path: notice, ref: base })).data;
            const named = Buffer.from(credits.content, 'base64').toString('utf8');
            const from = named.indexOf('## OBS Studio'), to = named.indexOf('\n## ', from + 1);
            if (from < 0 || !named.slice(from, to).includes(pin.version)) throw new Error(`${notice} has no OBS Studio section naming OBS ${pin.version}`);
            const credited = named.slice(0, from) + named.slice(from, to).split(pin.version).join(version) + named.slice(to);
            const swap = (key, value) => { next = next.replace(new RegExp(`("${key}": *)("[^"]*"|\\d+)`), (_, k) => `${k}${typeof value === 'number' ? value : JSON.stringify(value)}`); };
            swap('url', win.url); swap('sha256', win.sha256); swap('bytes', win.size);
            swap('sources_url', src.url); swap('sources_sha256', src.sha256);
            swap('linux_url', deb.url); swap('linux_sha256', deb.sha256); swap('linux_ubuntu', ubuntu);
            const image = pin.linux_ubuntu === ubuntu ? `stays on Ubuntu ${ubuntu}` : `moves from Ubuntu ${pin.linux_ubuntu} to Ubuntu ${ubuntu}`;
            const branch = `obs-bump/${version}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
            if (pulls.data.length) { core.info(`a pull request for OBS ${version} is open already`); return; }
            const head = (await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` })).data.object.sha;
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: head }).catch(async () => {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: head, force: true });
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha: file.sha,
              message: `fix(desktop): bundle OBS ${version}`,
              content: Buffer.from(next).toString('base64'),
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: notice, branch, sha: credits.sha,
              message: `chore(desktop): ${notice} names OBS ${version}`,
              content: Buffer.from(credited).toString('base64'),
            });
            const checks = process.env.BOT === 'true' ? 'they started by themselves, as the repository\'s bot opened it' : 'close and reopen this pull request to start them; once the repository\'s bot is set up, as MAINTAINING.md says, they start by themselves';
            const byHand = [
              'What to check by hand on Windows, with reel from that artifact (what no runner has: a GPU, a game, a microphone; `desktop/OBS.md`):',
              '- a game in fullscreen: Save clip with its hotkey, the clip of the game with its name, its audio on Game and Discord on its own track',
              '- the screen when no game runs, the desktop audio and the microphone from the setup\'s lists, heard at their volumes',
              '- the microphone\'s noise suppression (RNNoise, Speex, and NVIDIA\'s on an RTX card) and the gate',
              '- each GPU encoder the setup offers on that PC (NVENC, AMF, Quick Sync): its test and a saved clip',
              '- Capture games that run as administrator: the copy in Program Files, the task at logon, OBS\'s own Save hotkey',
              '- OBS stays hidden (no window, nothing on the taskbar), Show OBS and Hide OBS, and no question about safe mode after Quit, after an update or after OBS is ended',
            ].join('\n');
            const pr = await github.rest.pulls.create({
              owner, repo, base, head: branch,
              title: `fix(desktop): bundle OBS ${version}`,
              body: `OBS ${version} is out (${latest.html_url}). This bumps the version and the SHA-256 digests GitHub publishes for the Windows zip, the source archive and the Ubuntu ${ubuntu} package in \`${path}\`, with that package's Ubuntu, and the version \`${notice}\` names; nothing else. It is a fix, so once it is merged release-please releases reel with this OBS by itself.\n\nThe image with the real OBS (\`desktop/ci/obs.Dockerfile\`, built on the pin's \`linux_ubuntu\`) ${image}. Only that test image follows OBS's Ubuntu; the AppImage and the .deb are built on Debian 12 as before.\n\nBefore merging: the Desktop workflow's checks (${checks}). A pull request that moves the pin runs every one of them in full on each push: \`make desktop-check\`, the app against this OBS's Linux build under Xvfb, both Windows installers (reel, with this OBS in it, and reel light), the app starting that OBS under Wine (fresh and as an update over the newest release), and the AppImage and the .deb. Against the Linux OBS and under Wine every request reel's code sends is checked to be one this OBS has. The installers are the run's artifact \`reel-desktop-windows\`.\n\n${byHand}`,
            });
            core.info(`opened ${pr.data.html_url}`);
