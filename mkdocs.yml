site_name: reel
site_description: "Game clips that stay yours: one key saves the replay and copies a link that plays right in the chat."
site_url: https://locko2901.github.io/reel/

theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/icon.svg
  font: false
  palette:
    scheme: reel
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

extra_css:
  - assets/site.css

hooks:
  - ci/docs/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Setup guides:
      - setup/index.md
      - The server: setup/server.md
      - "All in one, Windows: reel": setup/all-in-one.md
      - "Your own OBS, Windows: reel light": setup/own-obs.md
      - Linux: setup/linux.md
      - No app: setup/no-app.md
      - The phone: setup/phone.md
      - Standalone: setup/standalone.md
  - Using reel:
      - Sharing and links: sharing.md
      - Link previews from storage: storage.md
      - Fast and bulk storage: bulk-storage.md
      - The editor: editor.md
      - The desktop app: desktop-app.md
      - Games and apps: games-and-apps.md
  - Looking after reel:
      - Updating: updating.md
      - Switching the sign-in method: switching-sign-in.md
      - Backing up: backup.md
      - Uninstalling: uninstalling.md
      - Building from source: building.md
  - Reference:
      - Configuration: configuration.md
      - How light it is: light.md
      - Privacy and security: privacy.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Questions: faq.md
