# Its own workspace, so the server's build never compiles webkit2gtk or the Windows crates.
[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "1.11.1"
edition = "2021"
license = "MIT"
authors = ["Lockoo"]
repository = "https://github.com/Locko2901/reel"
homepage = "https://locko2901.github.io/reel/"
rust-version = "1.85"

[workspace.dependencies]
reel-desktop-core = { path = "core" }
reel-core = { path = "../crates/core" }
reel-store = { path = "../crates/store" }
reel-media = { path = "../crates/media" }
reel-pipeline = { path = "../crates/pipeline" }
reel-server = { path = "../crates/server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
base64 = "0.22"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
tempfile = "3"
hound = "3.5"
dirs = "7"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
tracing-appender = "0.2"
gethostname = "1"
hex = "0.4"
flate2 = "1"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_SystemInformation", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader"] }
axum = "0.8"

# Keeps the target directory a third of the size.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
