<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reel</title>
<link rel="stylesheet" href="assets/reel.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="library">
<main class="page offline-page">
  <div class="notice active update-ask" id="update-ask" role="status" hidden><span class="grow"><b id="update-ask-title"></b> <span id="update-ask-words"></span></span><div class="actions"><button class="small primary" id="update-ask-install" type="button">Install now</button><button class="small" id="update-ask-later" type="button">Later</button></div></div>
  <div class="panel offline">
    <header><h2 id="offline-title">Cannot reach the server</h2></header>
    <div class="body">
      <p id="offline-words" class="offline-words"></p>
      <p id="offline-code" class="mono small muted"></p>
      <p id="offline-retry-line" class="small faint"></p>
      <p class="muted" id="offline-ways">Check the server URL under Settings, Server, pair again, or switch to standalone: the library on this PC, no server needed. The app's settings are always there, in the tray's Open settings and with Ctrl+, in this window.</p>
      <div class="offline-actions">
        <button class="btn primary" id="offline-retry">Retry now</button>
        <button class="btn" id="offline-settings">Open the app's settings</button>
        <button class="btn" id="offline-standalone">Switch to standalone</button>
      </div>
    </div>
  </div>
</main>
<div id="toasts"></div>
<script type="module" src="offline.js"></script>
</body>
</html>
