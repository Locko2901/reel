reel-store.workspace = true
reel-media.workspace = true
reel-pipeline.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
askama.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
mime.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
axum-login = "0.18.0"
password-auth = "1.0.0"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = "0.10.4"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
reqwest.workspace = true
