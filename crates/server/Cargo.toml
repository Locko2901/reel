[package]
name = "reel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# The demo's /style page and /__shot/ routes for the screenshots; never in a release.
style-page = []

[dependencies]
sqlx.workspace = true
