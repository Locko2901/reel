# cargo-about's settings for the licence page (ci/licence-page.sh), for both workspaces.
# A crate under a choice of licences is listed under the first of these it offers. Those whose text
# names no holder come first: their SPDX text is the whole licence when a crate ships none.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD-1-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# The same graph as deny.toml's, without what only the tests use.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["chrono"]

