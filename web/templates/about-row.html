<div class="srow about-row"><div class="slabel"><b>{{ r.title }}</b><span class="shelp">{{ r.help }}</span></div><div class="sctl">{% if !r.value.is_empty() %}<span class="about-value">{{ r.value }}{% if let Some(l) = r.value_link %} from <a class="mono" href="{{ l.url }}" rel="noopener" aria-label="{{ l.aria }}">{{ l.label }}</a>{% endif %}</span>{% endif %}{% for l in r.links %}<a class="btn small" href="{{ l.url }}" rel="noopener" aria-label="{{ l.aria }}">{{ l.label }}</a>{% endfor %}</div></div>
